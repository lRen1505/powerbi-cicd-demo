
name: Entrega CD Power BI PBIP

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  entregar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Validar y empaquetar PBIP
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED

          archivos = []
          for p in Path('.').rglob('*'):
              if not p.is_file():
                  continue
              if '.git' in p.parts or '.pbi' in p.parts:
                  continue
              if p.suffix == '.pbip' or any(
                  parte.endswith(('.Report', '.SemanticModel'))
                  for parte in p.parts
              ):
                  archivos.append(p)

          if not any(p.suffix == '.pbip' for p in archivos):
              raise SystemExit('ERROR: Falta archivo PBIP')

          for p in archivos:
              if p.suffix == '.json':
                  with p.open(encoding='utf-8-sig') as f:
                      json.load(f)

          with ZipFile('PowerBI-PBIP-Entrega.zip',
                       'w', ZIP_DEFLATED) as z:
              for p in archivos:
                  z.write(p)

          print('Paquete PBIP generado correctamente')
          PY

      - name: Publicar artefacto
        uses: actions/upload-artifact@v4
        with:
          name: PowerBI-PBIP-Entrega
          path: PowerBI-PBIP-Entrega.zip
          if-no-files-found: error
          retention-days: 30
